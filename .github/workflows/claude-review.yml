name: Claude review

on:
  pull_request:
    types: [opened, synchronize]
    branches: [master]

jobs:
  review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Review this pull request. Follow the checklist and output format in .claude/agents/reviewer.md.
            If the PR adds or changes a file in docs/specs/, check the change against its acceptance criteria.
            Read the diff with `gh pr diff`. Post your review as one PR comment with `gh pr comment`.
            You only comment. Never push, approve or merge.
          claude_args: |
            --allowedTools "Read,Grep,Glob,Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh pr comment:*)"